name: Deploy to GitHub Pages

# One site holds both branches: stable at the root, main under /dev/
on:
  push:
    branches: [stable, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          path: stable

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Assemble site
        run: |
          assemble() {
            src=$1
            out=$2
            mkdir -p "$out"
            cp -r "$src/src/." "$out/"
            for f in genre.json suno_style_vocal_spec.json suno_instrument_techniques.json suno_chord_phrases.json suno_mood_phrases.json suno_style_structure_phrases.json; do
              cp "$src/$f" "$out/"
            done
            # The About dialog reads the app version from here
            cp "$src/package.json" "$out/"
            cp "$src/images/application.ico" "$out/favicon.ico"
          }
          assemble stable _site
          assemble main _site/dev
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
