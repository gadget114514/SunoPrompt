<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Build Suno AI style prompts by ticking checkboxes — genres, vocals, instruments, chords, structures and BPM.">
  <title>Suno Style Generator</title>
  <!-- Every script and stylesheet is a local file, so nothing here needs 'unsafe-inline'. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <h1>🎵 <span data-i18n="title">Suno Style Generator</span></h1>
          <p data-i18n="subtitle">5つのカテゴリから選択してプロンプトを生成</p>
        </div>
        <div class="header-controls">
          <div class="bpm-section">
            <label for="bpm-input" data-i18n="bpm">BPM</label>
            <div class="bpm-input-group">
              <input type="range" id="bpm-slider" min="40" max="200" value="120" class="bpm-slider">
              <input type="number" id="bpm-input" min="40" max="200" value="120" class="bpm-number">
            </div>
          </div>
          <button id="parse-prompt-btn" class="btn btn-parse" data-i18n="parsePrompt">📥 Parse Prompt</button>
          <div class="language-switcher">
            <button class="lang-btn active" data-lang="en">English</button>
            <button class="lang-btn" data-lang="ja">日本語</button>
          </div>
        </div>
      </div>
    </header>

    <div class="workspace">
      <!-- Left Panel: Project Tree -->
      <div class="left-panel">
        <div class="panel-tabs">
          <button class="panel-tab-button active" data-panel-tab="projects">📁 Projects</button>
          <button class="panel-tab-button" data-panel-tab="settings">⚙️ Settings</button>
        </div>

        <div class="panel-tab-content active" id="projects-panel-tab">
          <div class="projects-section">
            <div class="project-input-group">
              <input type="text" id="project-name" placeholder="Project name..." class="project-name-input" data-i18n-placeholder="projectNamePlaceholder">
              <button id="save-project-btn" class="btn btn-primary btn-small" data-i18n="saveProject">💾 Save</button>
            </div>
            <div id="projects-list" class="projects-list"></div>
          </div>
        </div>

        <div class="panel-tab-content" id="settings-panel-tab">
          <div class="settings-section">
            <div class="setting-item">
              <label data-i18n="saveFolder">Save Folder</label>
              <div class="setting-value">
                <span id="current-folder" class="folder-path">Default folder</span>
                <button id="select-folder-btn" class="btn btn-secondary btn-small" data-i18n="browse">Browse</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Center Panel: Tabs & Content -->
      <div class="center-panel">
        <!-- Drag a tab to move it; the tab order is the order of the style text.
             BPM rides along with no content of its own — it only marks where the
             tempo is written, and is still set from the top bar. -->
        <div class="tabs" data-i18n-title="reorderTabs">
          <button class="tab-button tab-button-marker" draggable="true" data-tab="bpm" data-i18n="bpmTab">BPM</button>
          <button class="tab-button active" draggable="true" data-tab="genres" data-i18n="genres">Genres</button>
          <button class="tab-button" draggable="true" data-tab="vocals" data-i18n="vocals">Vocals</button>
          <button class="tab-button" draggable="true" data-tab="instruments" data-i18n="instruments">Instruments</button>
          <button class="tab-button" draggable="true" data-tab="chords" data-i18n="chords">Chords</button>
          <button class="tab-button" draggable="true" data-tab="structures" data-i18n="structures">Structures</button>
          <button class="tab-button" draggable="true" data-tab="others" data-i18n="others">Others</button>
        </div>

        <div class="selections-container">
          <div class="tab-content active" id="genres-tab">
            <div id="genres-list" class="items-list"></div>
          </div>
          <div class="tab-content" id="vocals-tab">
            <div id="vocals-list" class="items-list"></div>
          </div>
          <div class="tab-content" id="instruments-tab">
            <div id="instruments-list" class="items-list"></div>
          </div>
          <div class="tab-content" id="chords-tab">
            <div id="chords-list" class="items-list"></div>
          </div>
          <div class="tab-content" id="structures-tab">
            <div id="structures-list" class="items-list"></div>
          </div>
          <div class="tab-content" id="others-tab">
            <textarea id="others-input" class="others-textarea" data-i18n-placeholder="othersPlaceholder" placeholder="Free text..."></textarea>
          </div>
        </div>
      </div>

      <!-- Right Panel: Stage + Preview + Random -->
      <div class="right-panel">
        <div class="stage-section">
          <h3 data-i18n="stage">Stage</h3>
          <svg id="stage-diagram" class="stage-diagram" viewBox="0 0 216 120" role="img"></svg>
          <div id="stage-caption" class="stage-caption" data-i18n="stageHint">Hover a dot for its name</div>
        </div>

        <div class="preview-section">
          <div class="preview-header">
            <h3 data-i18n="preview">Preview</h3>
            <div class="preview-actions">
              <button type="button" id="copy-btn" class="icon-btn" data-i18n-title="copy">📋</button>
              <button type="button" id="save-btn" class="icon-btn" data-i18n-title="save">💾</button>
              <button type="button" id="clear-all-btn" class="icon-btn icon-btn-danger" data-i18n-title="clearAll">🗑️</button>
            </div>
          </div>
          <div id="preview" class="preview-box" data-i18n-placeholder="previewPlaceholder">Preview will appear here</div>
          <div id="char-count" class="char-count"></div>
        </div>

        <div class="random-section">
          <div class="random-header">
            <button id="random-btn" class="btn btn-primary btn-block" data-i18n="random">🎲 Random</button>
            <button type="button" id="toggle-random-targets-btn" class="icon-btn random-toggle-btn" aria-controls="random-targets" aria-expanded="false" data-i18n-title="showRandomTargets">▾</button>
          </div>
          <div class="random-targets" id="random-targets">
            <div class="random-target" data-category="genres">
              <input type="checkbox" id="random-target-genres" class="random-target-check" data-random-category="genres" checked>
              <label for="random-target-genres" data-i18n="genres">Genres</label>
              <button type="button" class="icon-btn random-one-btn" data-random-category="genres" data-i18n-title="randomGenres">🎲</button>
            </div>
            <div class="random-target" data-category="vocals">
              <input type="checkbox" id="random-target-vocals" class="random-target-check" data-random-category="vocals" checked>
              <label for="random-target-vocals" data-i18n="vocals">Vocals</label>
              <button type="button" class="icon-btn random-one-btn" data-random-category="vocals" data-i18n-title="randomVocals">🎲</button>
            </div>
            <div class="random-target" data-category="instruments">
              <input type="checkbox" id="random-target-instruments" class="random-target-check" data-random-category="instruments" checked>
              <label for="random-target-instruments" data-i18n="instruments">Instruments</label>
              <button type="button" class="icon-btn random-one-btn" data-random-category="instruments" data-i18n-title="randomInstruments">🎲</button>
            </div>
            <div class="random-target" data-category="chords">
              <input type="checkbox" id="random-target-chords" class="random-target-check" data-random-category="chords" checked>
              <label for="random-target-chords" data-i18n="chords">Chords</label>
              <button type="button" class="icon-btn random-one-btn" data-random-category="chords" data-i18n-title="randomChords">🎲</button>
            </div>
            <div class="random-target" data-category="structures">
              <input type="checkbox" id="random-target-structures" class="random-target-check" data-random-category="structures" checked>
              <label for="random-target-structures" data-i18n="structures">Structures</label>
              <button type="button" class="icon-btn random-one-btn" data-random-category="structures" data-i18n-title="randomStructures">🎲</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Drag to set how much room the log gets -->
    <div id="log-resizer" class="log-resizer" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-title="resizeLog"></div>

    <!-- Bottom: Log Container -->
    <div class="log-container">
      <div class="log-header">
        <h4 data-i18n="log">Log</h4>
        <div class="log-actions">
          <button id="clear-log-btn" class="btn-small" data-i18n="clearLog">Clear</button>
          <button type="button" id="toggle-log-btn" class="btn-small log-toggle" data-i18n-title="closeLog">✕</button>
        </div>
      </div>
      <div id="log-window" class="log-window"></div>
    </div>
  </div>

  <script src="webApi.js"></script>
  <script src="utils/promptGenerator.js"></script>
  <script src="renderer.js"></script>

  <!-- Paste a full prompt and let the parser tick what it recognises -->
  <div id="parse-modal" class="modal-overlay hidden">
    <div class="modal parse-modal" role="dialog" aria-modal="true" aria-labelledby="parse-modal-title">
      <div class="modal-header">
        <h3 id="parse-modal-title" data-i18n="parsePromptTitle">Parse Prompt</h3>
        <button type="button" id="parse-close-btn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <textarea id="parse-input" class="parse-textarea" data-i18n-placeholder="parsePlaceholder" placeholder="Paste a Style prompt to parse..."></textarea>
      <div class="parse-mode" role="radiogroup" aria-label="Parse mode">
        <label class="parse-mode-option">
          <input type="radio" name="parse-mode" value="ambiguous" checked>
          <span data-i18n="parseModeAmbiguous">Ambiguous match</span>
        </label>
        <label class="parse-mode-option">
          <input type="radio" name="parse-mode" value="precise">
          <span data-i18n="parseModePrecise">Precise match</span>
        </label>
      </div>
      <p class="parse-mode-hint" data-i18n="parseModeCaseHint">Case is ignored when matching</p>
      <div class="modal-actions">
        <button type="button" id="parse-cancel-btn" class="btn btn-secondary" data-i18n="parseCancel">Cancel</button>
        <button type="button" id="parse-run-btn" class="btn btn-primary" data-i18n="parseRun">Parse</button>
      </div>
    </div>
  </div>
</body>
</html>
